default_project: demo

projects:
  demo:
    directory: /home/tray/project/demo
    description: Demo project
    model: openai/gpt-5.6-sol
    effort: medium

qa:
  turn_timeout_minutes: 60
  question_timeout_minutes: 30

telegram:
  group_requires_mention: true
  question_answer_policy: initiator_only
  # Set TELEGRAM_FORUM_CHAT_ID in .env to enable one topic per new request.

